services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: api
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - gitBrain

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - gitBrain

networks:
  gitBrain:
    driver: bridge