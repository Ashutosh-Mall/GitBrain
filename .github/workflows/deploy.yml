name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push API
        run: |
          docker build -t ashutoshmall/gitbrain-api:latest -f apps/api/Dockerfile .
          docker push ashutoshmall/gitbrain-api:latest

      - name: Build & Push Web
        run: |
          docker build -t ashutoshmall/gitbrain-web:latest -f apps/web/Dockerfile .
          docker push ashutoshmall/gitbrain-web:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "$HOME/GitBrain" ]; then
              git clone https://github.com/Ashutosh-Mall/GitBrain.git $HOME/GitBrain
            fi

            cd $HOME/GitBrain

            git fetch origin
            git reset --hard origin/main

            cat > .env <<EOF
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            EOF

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            docker image prune -af