services:
  api:
    image: ashutoshmall/gitbrain-api:latest
    container_name: api
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - gitBrain

  web:
    image: ashutoshmall/gitbrain-web:latest
    container_name: web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - gitBrain

networks:
  gitBrain:
    driver: bridge